[pytest]
# Run pytest from the repository root: python -m pytest
testpaths = back/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -q
    --strict-markers
markers =
    unit: Pure unit tests with no I/O
    api: FastAPI endpoint tests using TestClient
    integration: Multi-layer workflow tests
    edge_cases: Edge-case and boundary tests
    db: Database model / CRUD tests
