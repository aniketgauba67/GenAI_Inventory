# Nixpacks.
#
# This file supports the GenAI Inventory application.
#
# The file provides:
# - checked-in configuration or documentation for the project.
#
# Key Structures Used:
# - repository-level source or configuration files.
#
# This file ensures:
# - contributors can understand the file purpose quickly.
#
# Editors: Aniket, Dipankar, Liam, Jin, and Philip.
[phases.setup]
nixPkgs = ['python312', 'postgresql_16.dev', 'gcc']

[phases.install]
cmds = [
  'python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r back/requirements.txt'
]

[start]
cmd = '/opt/venv/bin/python -m uvicorn back.main:app --host 0.0.0.0 --port $PORT'
