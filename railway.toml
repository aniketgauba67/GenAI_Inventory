[build]
builder = "nixpacks"

[deploy]
startCommand = "/opt/venv/bin/python -m uvicorn back.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
